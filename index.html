<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <title>Skills Test - 2nd Quarter</title>

    <style>
        body{
            background-image: url(https://i.pinimg.com/736x/4a/3e/99/4a3e99a137bc9ef9c30f38ddb3275b22.jpg); /* background image of nature */
            background-size: cover; /* makes the image stretch to fit the whole screen */
            background-position: center; /* keeps the middle of the image the middle */
            background-attachment: fixed; /* keeps it from moving when you scroll */
        }
        .card {
            border: none;
            border-radius: 20px;
            background-color: #fcf8f5;
        }

        .card-header {
            background-color: #e6a1b2 !important; /* added !important in lines 33 until 72 so that the colors stay since it somehow doesn't change without it */
            color: #ffffff !important;
            border-radius: 20px 20px 0 0 !important;
        }

        .form-label, h5, .text-primary {
            color: #5c4033 !important;
        }

        .alert-info {
            background-color: #f7e6e8;
            border-color: #f2d1d4;
            color: #5c4033;
        }

        .btn-success {
            background-color: #b4c8a8 !important;
            border-color: #b4c8a8 !important;
            color: #5c4033 !important;
            font-weight: bold;
        }

        .btn-success:hover {
            background-color: #a3b997 !important;
            border-color: #a3b997 !important;
        }

        #result {
            min-height: 120px;
            font-size: 1.05rem;
            background: #ffffff;
            border-left: 6px solid #b4c8a8;
            color: #5c4033;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #5c4033;
            background-color: #f7e6e8 !important;
            border-radius: 0 0 20px 20px !important;
        }
    </style>
</head>

<body>
<!-- centers everything -->
<div class="container py-5"> 

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white text-center p-4">

                    <h2>
                        <i class="bi bi-flask-fill"></i>
                        ⋆. ⌬ ˚ Non-Metal Elements ☣︎ :•.
                    </h2>

                    <p class="mb-0">
                        Periodic Table Information Finder
                    </p>

                </div>

                <div class="card-body p-4">
                    <!-- provides the instructions for the user -->
                    <div class="alert alert-info"> 
                        <strong>Instructions:</strong><br>
                        Enter the <b>symbol</b> of a non-metal element
                        (Example: H, O, Cl, Ne, Xe).
                    </div>

                    <form>
                        <!-- input field container -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                <i class="bi bi-search"></i>
                                Element Symbol
                            </label>
                            <!-- where the user will input the symbol-->
                            <input
                                type="text"
                                id="element_name"
                                class="form-control form-control-lg"
                                placeholder="Enter the symbol here">

                        </div>

                        <div class="d-grid">
                            <!-- when the button is clicked, it will run the element_checker in the main.py file-->
                            <input
                                type="button"
                                py-click="element_checker"
                                value="Check Details"
                                class="btn btn-success btn-lg">

                        </div>

                    </form>

                    <hr>

                    <h5 class="text-primary">
                        <i class="bi bi-card-list"></i>
                        Result
                    </h5>
                    <!-- shows the results of the  search-->
                    <div id="result" class="rounded p-3 shadow-sm">

                    </div>

                </div>

                <div class="card-footer bg-light text-center footer-text">

                    Skills Test • 2nd Quarter • Aisha

                </div>

            </div>

        </div>

    </div>

</div>
<!-- connects the files together to work the code -->
<py-script src="main.py"></py-script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
